<body>
   <form action="logic.html" method="post">
        <label for="text1">Name:</label>
        <input type="text" id="text1" name="text1" required><br><br>

        <label for="num2">Password:</label>
        <input type="password" id="num2" name="num2" required><br><br>

        <input type="date" id="DATE" name="DATE" required><br><br>

        <color="blue">Select your favorite color:</color>
        <input type="color" id="color" name="color"><br><br>    
        
        
        

        <input type="submit" value="Submit">
    </form>
